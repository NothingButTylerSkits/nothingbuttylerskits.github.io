<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>YOU WERE WRONG.</title> <style> @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap'); * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 100%; height: 100%; overflow: hidden; } body { background: radial-gradient(circle at center, #190000 0%, #080000 38%, #000 78%); color: #eee; font-family: "Cinzel", serif; display: flex; align-items: center; justify-content: center; position: relative; } /* Dark atmospheric glow */ body::before { content: ""; position: fixed; inset: 0; background: radial-gradient( ellipse at center, rgba(120, 0, 0, 0.22) 0%, rgba(40, 0, 0, 0.08) 35%, transparent 70% ); pointer-events: none; animation: breathing 5s ease-in-out infinite; } /* Scanlines */ body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient( to bottom, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 4px ); opacity: 0.5; } .message { position: relative; z-index: 2; text-align: center; width: min(90%, 900px); font-size: clamp(1rem, 2.1vw, 1.65rem); line-height: 2.05; letter-spacing: 0.22em; text-transform: uppercase; text-shadow: 0 0 5px rgba(255,255,255,0.15), 0 0 15px rgba(150,0,0,0.45), 0 0 35px rgba(100,0,0,0.3); animation: evilFlicker 6s infinite; } .line { display: block; opacity: 0; animation: reveal 1.4s forwards; } .line:nth-child(1) { animation-delay: 0.5s; } .line:nth-child(2) { animation-delay: 1.2s; } .line:nth-child(3) { animation-delay: 1.9s; } .line:nth-child(4) { animation-delay: 2.6s; color: #ff3333; text-shadow: 0 0 5px #ff0000, 0 0 15px rgba(255,0,0,0.7), 0 0 35px rgba(150,0,0,0.6); } @keyframes reveal { 0% { opacity: 0; filter: blur(5px); transform: translateY(5px); } 60% { opacity: 0.5; } 100% { opacity: 1; filter: blur(0); transform: translateY(0); } } @keyframes evilFlicker { 0%, 91%, 94%, 97%, 100% { opacity: 1; } 92% { opacity: 0.82; } 93% { opacity: 1; } 95% { opacity: 0.55; } 96% { opacity: 0.95; } 98% { opacity: 0.7; } } @keyframes breathing { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } } /* Random atmospheric particles */ .ember { position: fixed; bottom: -10px; width: 2px; height: 2px; background: #ff3333; border-radius: 50%; opacity: 0; pointer-events: none; box-shadow: 0 0 8px #ff0000; animation: rise linear infinite; } @keyframes rise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.7; } 80% { opacity: 0.3; } 100% { transform: translateY(-100vh) translateX(40px); opacity: 0; } } </style> </head> <body> <div class="message"> <span class="line">YOU THOUGHT THE ADDRESS WAS REAL.</span> <span class="line">YOU WERE WRONG.</span> <span class="line">THEY ARE WAITING ABOVE.</span> <span class="line">FOLLOW THE HEAT.</span> </div> <script> // Create subtle floating embers const emberCount = 25; for (let i = 0; i < emberCount; i++) { const ember = document.createElement("div"); ember.className = "ember"; ember.style.left = Math.random() * 100 + "vw"; ember.style.animationDuration = (5 + Math.random() * 8) + "s"; ember.style.animationDelay = Math.random() * 8 + "s"; ember.style.width = (1 + Math.random() * 2) + "px"; ember.style.height = ember.style.width; document.body.appendChild(ember); } </script> </body> </html>
